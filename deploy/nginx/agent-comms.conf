# RFC-001 §9: nginx terminates TLS; the server binds loopback ONLY.
# Needs nginx >= 1.25.1 for `http2 on;`. On Ubuntu 24.04 (nginx 1.24) use
# `listen 443 ssl http2;` instead.
# SSE needs proxy_buffering OFF and a long read timeout (streams are
# long-lived, ping every 20 s). /rpc is request/response. /raw serves mirror
# bytes.
# §9 per-IP 401 bucket: the server (--trust-proxy) keys on the RIGHTMOST
# X-Forwarded-For hop, which is the $remote_addr nginx appends. SINGLE-HOP
# ONLY: if a CDN or LB is ever put in front, the rightmost hop becomes the LB
# and every client shares one bucket. Switch to ngx_http_realip
# (set_real_ip_from) first.
# In nginx.conf (main context) also set `worker_shutdown_timeout 30s;`.
# Without it, a reload leaves old workers holding SSE streams indefinitely.
server {
  listen 80;
  listen [::]:80;
  server_name comms.example.internal;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name comms.example.internal;

  # .internal is not a public TLD, so Let's Encrypt cannot issue for it. Use
  # an internal CA (or a public name) and point these at its chain and key.
  ssl_certificate     /etc/letsencrypt/live/comms.example.internal/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/comms.example.internal/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # §9 Content-Length cap, applied before parsing.
  #  - 256 KiB < body <= 320k: the SERVER's typed 413 wins.
  #  - body > 320k: the edge answers with the SAME typed JSON-RPC usage error.
  # Never nginx's HTML page: RpcBus maps that to exit 1 ("non-JSON response")
  # instead of usage exit 2 (§7 exit table; claude M6 probe).
  client_max_body_size 320k;
  error_page 413 = @too_large;
  location @too_large {
    default_type application/json;
    return 413 '{"jsonrpc":"2.0","error":{"code":-32600,"message":"body too large","data":{"busError":"usage","detail":"body too large (edge cap)"}},"id":null}';
  }

  location /rpc {
    proxy_pass http://127.0.0.1:8700;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;    # > 60 s inbox.wait long-poll (§6)
    proxy_send_timeout 75s;
    proxy_buffering off;
  }

  location = /stream.ticket {  # POST, request/response (not SSE)
    proxy_pass http://127.0.0.1:8700;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  location /stream {
    gzip off; # SSE must never be buffered by a later global gzip on
    proxy_pass http://127.0.0.1:8700;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;       # SSE — THE critical line
    proxy_cache off;
    proxy_read_timeout 3600s;  # applies per read; the 20 s pings keep it warm
    chunked_transfer_encoding on;
  }

  location /raw {
    proxy_pass http://127.0.0.1:8700;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://127.0.0.1:8700;   # web UI (GET /) + /health
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
