# RFC-001 §9: nginx terminates TLS; the server binds loopback ONLY.
# SSE needs proxy_buffering OFF + long read timeout (streams are long-lived,
# ping every 20 s); /rpc is request/response; /raw serves mirror bytes.
# §9 per-IP 401 bucket: nginx MUST set X-Forwarded-For (server started with
# --trust-proxy keys on the RIGHTMOST hop). proxy_add_x_forwarded_for appends.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name comms.example.internal;

  ssl_certificate     /etc/letsencrypt/live/comms.example.internal/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/comms.example.internal/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # §9 Content-Length cap pre-parse (server enforces too; nginx fails fast)
  client_max_body_size 320k;

  location /rpc {
    proxy_pass http://127.0.0.1:8700;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;    # > 60 s inbox.wait long-poll (§6)
    proxy_send_timeout 75s;
    proxy_buffering off;
  }

  location /stream {
    proxy_pass http://127.0.0.1:8700;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;       # SSE — THE critical line
    proxy_cache off;
    proxy_read_timeout 3600s;  # long-lived; 20 s pings keep it warm
    chunked_transfer_encoding on;
  }

  location /raw {
    proxy_pass http://127.0.0.1:8700;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://127.0.0.1:8700;   # web UI (GET /) + /health
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
